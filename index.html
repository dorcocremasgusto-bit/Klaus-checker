<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080000">

    <title>KLAUS CHECKER</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="background-glow"></div>

<main class="container">

    <div class="brand">
        <div class="symbol">⛧</div>

        <h1>KLAUS <span>CHECKER</span></h1>

        <p class="subtitle">
            THE DARK VERIFICATION SYSTEM
        </p>
    </div>

    <div class="line"></div>

    <section class="checker">

        <div class="status">
            <span class="pulse"></span>
            SYSTEM ONLINE
        </div>

        <h2>WHATSAPP STATUS</h2>

        <p class="description">
            Verify the status of a WhatsApp number.
        </p>

        <label for="phone">
            ENTER WHATSAPP NUMBER
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="+509XXXXXXXX"
            autocomplete="tel"
        >

        <button id="checkBtn" onclick="checkNumber()">
            <span>⛧</span> VERIFY NUMBER
        </button>

        <div id="result" class="result">
            <div class="result-icon">⚠</div>
            <p>WAITING FOR VERIFICATION</p>
        </div>

    </section>

    <div class="information">
        <span>SECURE CONNECTION</span>
        <span>API PROTECTED</span>
    </div>

    <footer>
        <p>KLAUS CHECKER © 2026</p>
        <p class="owner">DESIGNED BY KLAUSDEV</p>
    </footer>

</main>

<script src="/script.js"></script>

</body>
</html>
